[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidev-videos"
version = "0.6.3"
description = "Release-hosted video pipeline CLI for Slidev decks (manifest-driven fetch/encode/publish/check/frames)"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
# `slidev-videos depth`: depth maps for StagePhoto (Depth Anything V2 Small, CPU)
depth = ["onnxruntime>=1.17", "numpy", "pillow", "huggingface_hub"]

[project.scripts]
slidev-videos = "slidev_videos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidev_videos = ["shared.toml"]
