notes   = "Cassini Grand Finale — Saturn ring-dive animation, no voice-over (3:41). Trim 0:00–1:30: the approach and first ring dive fit a reel slot; the rest repeats the dive geometry. Source: cosmology/cassini_grand_finale_no_vo.mp4"

[[videos]]
name    = "stars_pan_audio.mp4"
profile = "standard"
notes   = "Starfield pan with ambient audio (0:20). Source: course release `videos` asset Stars_Pan_Audio.mp4 (HEVC release copy used as the raw — no Drive original)"

[[videos]]
name    = "telescope.mp4"
profile = "standard"
notes   = "Telescope under the night sky (0:40). Source: science/telescope.mp4"

[[videos]]
name    = "hubble.mp4"
profile = "standard"
notes   = "Hubble Space Telescope in orbit (0:33). Source: course release `videos` asset Hubble.mp4 (HEVC release copy used as the raw — no Drive original)"

[[videos]]
name    = "webb_reel.mp4"
profile = "standard"
trim    = ["0:00", "1:30"]
notes   = "JWST image reel (2:58). Trim 0:00–1:30: the first 90 s carry the headline images; keeps the reel slot short. Source: released/webb_reel.mp4"

[[videos]]
name    = "milky_way_sim_audio.mp4"
profile = "high-motion"
notes   = "Milky Way galaxy formation simulation with audio (1:01). Source: released/milky_way_sim_audio.mp4"

[[videos]]
name    = "sdss_universe_zoom.mp4"
