# Shared clip registry for slidev-videos consumers.
#
# Entries are CERN/space B-roll and CGI sims shared by more than one deck,
# published on this repo's `videos-shared` GitHub Release (1080p H.264 web
# encodes). The 43-entry library (34 from the 2026-09-03 D3 encode pass, course spec
# §5.3; 9 promoted from outreach_talks on 2026-09-08); `check` and `pull --include-shared`
# in consumer projects resolve these names against that release.
#
# Naming: lowercase snake_case, no resolution/codec suffixes; CDS clips keep
# their report-number digits (e.g. cern_footage_2022_013_001.mp4).
#
# Each `notes` says what the clip shows and the exact source it was encoded
# from (gdrive folders under gdrive:work/outreach/resources/videos/, or the
# course's archived HEVC release `videos` on
# MindaugasSarpis/CERN_lessons_on_data_analysis). `trim` entries also record
# why the web copy is cut; the raw stays whole so a trim is reversible.

[defaults]
release_tag = "videos-shared"
repo        = "MindaugasSarpis/slidev-videos"

# --- space / astronomy -------------------------------------------------------

[[videos]]
name    = "skylapse.mp4"
profile = "silent-loop"
notes   = "CERN aerial timelapse loop (7:29). Source: released/skylapse.mp4"

[[videos]]
name    = "drone_climbing_mountain.mp4"
profile = "high-motion"
notes   = "Drone ascent up a mountain face (0:27). Source: released/drone_climbing_mountain.mp4"

[[videos]]
name    = "nasa_mars_mariner_4_pan_audio.mp4"
profile = "standard"
notes   = "Mariner 4, 1965 — first close-up image of Mars, slow pan with audio (0:20). Source: released/nasa_mars_mariner_4_pan_audio.mp4"

[[videos]]
name    = "perseverance_rover_landing_nasa.mp4"
profile = "high-motion"
trim    = ["1:40", "3:10"]
notes   = "NASA Perseverance Mars landing, EDL camera footage (3:10; true 3840x2160 H.264 60 fps master, scaled to 1080p). Trim 1:40–3:10: the parachute descent and touchdown are the last 90 s; the earlier part is titles and the cruise-stage separation. Source: science/perseverence_rover_landing_nasa.mp4 (spelling fixed in the shared name)"

[[videos]]
